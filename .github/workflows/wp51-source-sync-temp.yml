name: Temporary WP5.1 source sync

on:
  push:
    branches:
      - fix/wp51-sync-public-source

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source-sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify exact WP5.1 final candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wp51
          asset="Unity-TeamForge-0.5.1-WP5.1-path-resilience-final-candidate-win-x64.zip"
          gh release download "v0.5.1-prealpha-wp5.1" --pattern "$asset" --dir .wp51
          echo "4c5750124b6420338df4ba7d8548ca95ef13a1e16cd0a001fed202a12884210c  .wp51/$asset" | sha256sum -c -
          unzip -q ".wp51/$asset" -d .wp51/extracted

      - name: Restore only reviewed WP5.1 source, tests, and contracts
        shell: bash
        run: |
          set -euo pipefail
          root=".wp51/extracted/Unity-TeamForge-0.5.1-WP5.1"
          files=(
            "launcher/src/TeamForge.Launcher.Core/DiagnosticsRecovery.cs"
            "launcher/src/TeamForge.Launcher.Core/ExecutionAliasManager.cs"
            "launcher/src/TeamForge.Launcher.Core/LauncherPaths.cs"
            "launcher/src/TeamForge.Launcher.Core/PathResilience.cs"
            "launcher/src/TeamForge.Launcher.Core/TeamForge.Launcher.Core.csproj"
            "launcher/src/TeamForge.Launcher.Core/UnityLaunchPolicy.cs"
            "launcher/src/TeamForge.Launcher/MainWindow.xaml.cs"
            "launcher/src/TeamForge.Launcher/RuntimePins.g.cs"
            "launcher/src/TeamForge.Launcher/TeamForge.Launcher.csproj"
            "launcher/src/TeamForge.Launcher/app.manifest"
            "launcher/tests/TeamForge.Launcher.Core.Tests/Program.cs"
            "project-peer/src/cli-policy.mjs"
            "project-peer/src/path-resilience-contract.json"
            "project-peer/test/wp4-unity-host-handoff-static.test.mjs"
            "project-peer/test/wp51-path-resilience-static.test.mjs"
            "release-contract.json"
            "scripts/validate-repository.mjs"
          )
          for file in "${files[@]}"; do
            test -f "$root/$file"
            mkdir -p "$(dirname "$file")"
            cp "$root/$file" "$file"
          done

      - name: Verify exact candidate Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Blob mismatch: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          done <<'EOF'
          b61f70d91da3357a47939c4baf59e9e057841610 launcher/src/TeamForge.Launcher.Core/DiagnosticsRecovery.cs
          cb2177459b258eae5203fa9b05458cf535cb2925 launcher/src/TeamForge.Launcher.Core/ExecutionAliasManager.cs
          016b5732fbeb5c4f31150ccd815dc1a4f49ed3b9 launcher/src/TeamForge.Launcher.Core/LauncherPaths.cs
          8d52f0d4b702971753c5f842b028da73e2bfc62d launcher/src/TeamForge.Launcher.Core/PathResilience.cs
          c3f1c2ba558bf60e2410b746c3caded3a878bb8a launcher/src/TeamForge.Launcher.Core/TeamForge.Launcher.Core.csproj
          f160e784fae841a892c3ead66c026500834d7627 launcher/src/TeamForge.Launcher.Core/UnityLaunchPolicy.cs
          025a4aa3e8d55ac76bd1d179d9af84f8d29c6a1f launcher/src/TeamForge.Launcher/MainWindow.xaml.cs
          11c0638a9ac90b6fbea2386f9fe979fe530eafdc launcher/src/TeamForge.Launcher/RuntimePins.g.cs
          1ec654a9a0ccdd0e65ba2133a8277714677eca87 launcher/src/TeamForge.Launcher/TeamForge.Launcher.csproj
          3932faf5a9014f0e14050532549f29712ef76551 launcher/src/TeamForge.Launcher/app.manifest
          c7caafa8d83ba5da44fe5e29b9f9f26ca805d17c launcher/tests/TeamForge.Launcher.Core.Tests/Program.cs
          3ad572cf653c92c543600f178341223e73f2d452 project-peer/src/cli-policy.mjs
          1c712820e9f5ffae981aa2a38a988931bc7b47b9 project-peer/src/path-resilience-contract.json
          18083700fa8f50e3544a905261a7d1c24fc9112f project-peer/test/wp4-unity-host-handoff-static.test.mjs
          17d257cc8d24130441e8c011ff7918f82a5c8dc2 project-peer/test/wp51-path-resilience-static.test.mjs
          fc265f8f804560a5c36d6906bb45a94297f87184 release-contract.json
          5be07c498d7dec0b39079b84885b59341352254d scripts/validate-repository.mjs
          EOF

      - name: Commit exact WP5.1 source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wp51
          rm -f .github/workflows/wp51-source-sync-temp.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: sync WP5.1 path resilience source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
