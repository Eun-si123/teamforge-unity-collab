name: Portable agent harness tests

on:
  pull_request:
    paths:
      - 'harness/**'
      - '.github/workflows/portable-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test harness/test/harness.test.mjs
      - name: Prepare isolated verifier image
        run: docker pull node:24-bookworm-slim
      - name: Fake LLM, real tool loop, patch and offline test
        env:
          HARNESS_INTEGRATION: '1'
        run: node --test harness/test/integration.test.mjs
