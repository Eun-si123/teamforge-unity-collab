name: Engineering Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/AGENT_MEMORY.md'
      - 'docs/agent-checkpoints/**'
  pull_request:
    paths-ignore:
      - 'docs/AGENT_MEMORY.md'
      - 'docs/agent-checkpoints/**'

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-and-validate:
    name: Engineering Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Determine changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
            git diff --name-only "$base" "$head" > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
            head="$PUSH_SHA"
            git diff --name-only "$base" "$head" > changed-files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
            git diff --name-only "$base" "$head" > changed-files.txt
          else
            base="$(git rev-parse HEAD)"
            head="$base"
            git ls-files > changed-files.txt
          fi
          {
            echo "TEAMFORGE_DIFF_BASE=$base"
            echo "TEAMFORGE_DIFF_HEAD=$head"
          } >> "$GITHUB_ENV"
          sort -u -o changed-files.txt changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Classify risk and recommended validation
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/classify-change.mjs --stdin --github-output "$GITHUB_OUTPUT" < changed-files.txt | tee change-classification.json

      - name: Test maintainability review policy
        run: npm run test:maintainability

      - name: Test localized published-candidate drift rejection
        run: npm run test:published-candidate

      - name: Review maintainability growth
        run: npm run review:maintainability -- --base "$TEAMFORGE_DIFF_BASE" --head "$TEAMFORGE_DIFF_HEAD"

      - name: Validate engineering process contract
        run: npm run validate:engineering

      - name: Validate documentation governance
        run: npm run validate:docs

      - name: Validate coding-agent evaluation contracts
        run: |
          python3 scripts/agent_evals.py validate
          python3 -m unittest discover -s scripts -p 'test_agent_eval*.py'

      - name: Validate workflow security policy
        run: npm run validate:workflows

      - name: Write quality summary
        if: always()
        shell: bash
        env:
          RISK: ${{ steps.classify.outputs.risk }}
          GATES: ${{ steps.classify.outputs.gates }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo '## TeamForge engineering quality gate'
            echo
            echo "- Changed files: ${CHANGED_COUNT:-unknown}"
            echo "- Path-based risk: ${RISK:-unknown}"
            echo "- Recommended gates: ${GATES:-unknown}"
            echo
            echo 'This classification routes review and validation. It does **not** claim that Unity, chaos, release, or physical field evidence has passed.'
          } >> "$GITHUB_STEP_SUMMARY"
