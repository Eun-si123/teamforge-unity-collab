name: Publish Post-r7 Recovery Candidate r8

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: publish-post-r7-recovery-candidate-r8
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish current main recovery candidate r8
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_TAG: v0.5.1-prealpha-wp5.1-r8
      RELEASE_TITLE: TeamForge 0.5.1 WP5.1 Post-r7 Recovery Candidate r8
      CANDIDATE_NAME: Unity-TeamForge-0.5.1-WP5.1-path-resilience-candidate-r8-win-x64.zip
      STAGED_ROOT_NAME: Unity-TeamForge-0.5.1-WP5.1

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify manual publication targets main only
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'The r8 candidate may only be published from main after review.'
          }
          # A recovery candidate from an older main would be a misleading new ZIP.
          # Checkout uses fetch-depth: 0, so the original merged recovery commit
          # must be in the exact source ancestry before publication can proceed.
          $recoveryMerge = '5e986f20473ca9090314e490808863269eea95a8'
          git merge-base --is-ancestor $recoveryMerge $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Selected r8 source does not include the merged post-r7 recovery fixes.'
          }

      - name: Refuse to overwrite an existing r8 release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; its assets remain immutable."
          } else {
            # An absent Release is not permission to reuse an existing Git tag.
            $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify r8 tag absence.' }
            if (-not [string]::IsNullOrWhiteSpace(($existingTag | Out-String).Trim())) {
              throw "Tag $env:RELEASE_TAG already exists without a published Release."
            }
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Neither Release nor tag $env:RELEASE_TAG exists; building a fresh candidate."
          }
          exit 0

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup .NET 10 SDK
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.303'

      - name: Install pinned npm and validate source
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global npm@11.19.0
          if ((npm --version).Trim() -ne '11.19.0') { throw 'Pinned npm 11.19.0 was not selected.' }
          npm run install:all
          npm run validate

      - name: Download pinned Node runtime archive
        if: steps.existing.outputs.exists != 'true'
        id: node_runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'node-v24.19.0-win-x64.zip'
          $extractParent = Join-Path $env:RUNNER_TEMP 'teamforge-node-runtime'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extractParent
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.19.0/node-v24.19.0-win-x64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '57f71ab3652e797d84acddc79c81cc9ff1c6ddb2a1974cdb83f00fee9bff4c73'
          if ($actual -ne $expected) { throw "Pinned Node archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractParent
          $nodeRoot = Join-Path $extractParent 'node-v24.19.0-win-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $nodeRoot 'node.exe') -PathType Leaf)) {
            throw 'Pinned Node runtime did not extract to the expected directory.'
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "root=$nodeRoot" >> $env:GITHUB_OUTPUT

      - name: Build and verify packaged Runtime and Windows Launcher
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          NODE_ARCHIVE: ${{ steps.node_runtime.outputs.archive }}
          NODE_ROOT: ${{ steps.node_runtime.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/build-runtime-bundle.mjs --node-root $env:NODE_ROOT --node-archive $env:NODE_ARCHIVE
          node scripts/verify-runtime-bundle.mjs --packaged
          node scripts/build-launcher.mjs
          node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-publish-verify-r8')
          dotnet run --project launcher/tests/TeamForge.Launcher.Core.Tests/TeamForge.Launcher.Core.Tests.csproj -c Release
          dotnet run --project launcher/tests/TeamForge.Diagnostics.Tests/TeamForge.Diagnostics.Tests.csproj -c Release
          npm run validate:release

      - name: Stage and validate exact candidate tree
        if: steps.existing.outputs.exists != 'true'
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stageRoot = Join-Path $env:RUNNER_TEMP $env:STAGED_ROOT_NAME
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stageRoot
          node scripts/stage-release.mjs --staging $stageRoot

          Push-Location $stageRoot
          try {
            node scripts/validate-public-source.mjs
            node scripts/verify-runtime-bundle.mjs --packaged
            node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-staged-verify-r8')
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stageRoot 'release-manifest.json') -PathType Leaf)) {
            throw 'Staging completed without release-manifest.json.'
          }
          "root=$stageRoot" >> $env:GITHUB_OUTPUT

      - name: Create immutable ZIP and SHA-256 sidecar
        if: steps.existing.outputs.exists != 'true'
        id: archive
        shell: pwsh
        env:
          STAGE_ROOT: ${{ steps.stage.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:RUNNER_TEMP 'teamforge-release-r8'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $publishRoot
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          $zip = Join-Path $publishRoot $env:CANDIDATE_NAME
          Compress-Archive -LiteralPath $env:STAGE_ROOT -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $sidecar = "$zip.sha256"
          "$hash  $env:CANDIDATE_NAME" | Set-Content -Encoding ascii -NoNewline -LiteralPath $sidecar
          Write-Host "Candidate SHA-256: $hash"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sidecar=$sidecar" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Generate build provenance attestation
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.zip }}

      - name: Verify exact local ZIP before publication
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File scripts/verify-current-release-archive.ps1 -ArchivePath $env:ZIP_PATH
          if ($LASTEXITCODE -ne 0) { throw "Local archive verification failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub pre-release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
          SIDECAR_PATH: ${{ steps.archive.outputs.sidecar }}
          CANDIDATE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $notes = Join-Path $env:RUNNER_TEMP 'teamforge-wp51-r8-release-notes.md'
          $lines = @(
            '## TeamForge 0.5.1 — WP5.1 Post-r7 Recovery Candidate r8',
            '',
            "This is a **pre-release / FIELD_BLOCKED** candidate built from reviewed main commit $env:GITHUB_SHA.",
            '',
            '### Why this is a new candidate',
            '- Published r7 is immutable; its ZIP/hash and exact physical/automated evidence are not changed by this release.',
            '- r8 is the first separately identified Windows candidate intended to include post-r7 source recovery fixes merged through PR #209.',
            '',
            '### Recovery changes in the source candidate',
            '- Continued health polling prevents an unavailable Host Direct Seed from continuing to be presented as Ready.',
            '- Opening an existing verified Active project uses an identity-bound short execution alias where required for long Windows paths.',
            '- Managed-root validation rejects selection of an individual Project UUID folder as the Projects root.',
            '- Server-authoritative security, identity, managed-root and protocol checks remain fail-closed.',
            '',
            '### Evidence boundary',
            '- PR #209 source CI/Unity test success is NOT evidence for this newly packaged ZIP.',
            '- Exact r8 package validation is dispatched only after immutable publication.',
            '- Physical two-PC Host/Guest work remains pending, including the original r7-on-Host failures and Windows lifecycle tests.',
            '- Never reuse r7 field evidence as proof of the new r8 behavior; state remains **FIELD_BLOCKED**.',
            '',
            '### Packaging',
            '- Product version: 0.5.1',
            '- Release lineage: 0.5.1-wp5.1-path-resilience',
            '- Target: win-x64',
            '- Bundled Node: 24.19.0',
            '- Launcher: self-contained .NET 10 Windows build',
            "- Candidate SHA-256: $env:CANDIDATE_SHA256",
            '',
            '### Remaining exact-package and physical checks',
            '- Verify exact published r8 ZIP SHA-256, release-manifest paths/hashes, clean extraction, and bundled runtime/launcher checks.',
            '- On a fresh non-elevated Windows Host, confirm UAC firewall rule scope, Host Direct Seed availability, and truthful Ready/Unavailable state.',
            '- Confirm a fresh Guest can receive and open a verified Active project under long/complex Windows paths without the old PackageCache error.',
            '- Verify UUID/root-directory guards still reject nesting or conflicting project identities.',
            '- Occupy the preferred Seed port, verify actual fallback reachability, then repeat Host Stop/Start and a fresh Guest transfer.',
            '- Exercise real two-Editor lock/contention/Hierarchy/Presence flows; include PR #217 only if it is merged into main before dispatch.',
            '- Record physical outcomes separately; do not promote alpha readiness from a source or package CI result.'
          )
          $lines -join "`n" | Set-Content -Encoding utf8 -LiteralPath $notes

          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file $notes `
            --prerelease `
            $env:ZIP_PATH `
            $env:SIDECAR_PATH

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,name,isPrerelease,targetCommitish,url,assets

      - name: Dispatch exact r8 Release validation
        if: steps.existing.outputs.exists == 'true' || success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh workflow run release-validation.yml --repo $env:GITHUB_REPOSITORY --ref main -f release_tag=$env:RELEASE_TAG
          Write-Host "Dispatched exact r8 Release validation for $env:RELEASE_TAG."

      - name: Upload publication evidence
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp51-r8-publication-evidence
          path: |
            ${{ steps.archive.outputs.sidecar }}
            ${{ steps.stage.outputs.root }}/release-manifest.json
          if-no-files-found: error
