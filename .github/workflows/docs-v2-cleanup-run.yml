name: Documentation V2 cleanup run

on:
  push:
    branches:
      - docs/documentation-architecture-v2-cleanup-run

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Apply precise documentation patches
        run: python3 scripts/docs-v2-cleanup-temp.py

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run validate:docs

      - name: Validate repository
        run: npm run validate

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'BlackProtogen'
          git config user.email '267835237+Eun-si123@users.noreply.github.com'
          git add README.md AGENTS.md docs/HOW_IT_WORKS.md docs/STATUS.md docs/SOURCE.md docs/architecture.md .github/workflows/pages.yml scripts/build-sitemap.py
          git commit -m 'docs: improve human and agent reading paths'
          git push origin HEAD:docs/documentation-architecture-v2-cleanup-run
