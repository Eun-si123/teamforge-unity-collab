name: Translation packet smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and verify registered-locale packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-translation-test
          python3 scripts/build-translation-packet.py --locale ko --output-dir dist-translation-test
          python3 scripts/verify-translation-packet.py \
            dist-translation-test/TeamForge-translation-packet-ko.zip \
            --expected-locale ko

      - name: Verify unregistered locale safety gate
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/build-translation-packet.py \
            --locale zz-ZZ \
            --output-dir dist-translation-test/refused; then
            echo 'Unregistered locale unexpectedly succeeded without --allow-unregistered.' >&2
            exit 1
          fi

          python3 scripts/build-translation-packet.py \
            --locale zz-ZZ \
            --allow-unregistered \
            --output-dir dist-translation-test/allowed
          python3 scripts/verify-translation-packet.py \
            dist-translation-test/allowed/TeamForge-translation-packet-zz-ZZ.zip \
            --expected-locale zz-ZZ

      - name: Verify packet does not contain translated Korean target text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          packet = Path('dist-translation-test/TeamForge-translation-packet-ko.zip')
          root = 'TeamForge-translation-packet-ko/'
          with zipfile.ZipFile(packet) as zf:
              homepage = json.loads(zf.read(root + 'HOMEPAGE_SOURCE.en.json'))
              demo = json.loads(zf.read(root + 'EDITOR_DEMO_SOURCE.en.json'))
              glossary = json.loads(zf.read(root + 'GLOSSARY_DRAFT.json'))

          assert all('target' not in item for item in homepage['anchors'])
          assert all(key == value for key, value in demo['exact'].items())
          assert all(key == value for key, value in demo['attributes'].items())
          assert all(item['target'] is None for item in glossary['terms'])
          print('Packet contains canonical English source/inventory only.')
          PY
