name: Translation packet smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and verify registered-locale packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-translation-test
          python3 scripts/build-translation-packet.py --locale ko --output-dir dist-translation-test
          python3 scripts/verify-translation-packet.py \
            dist-translation-test/TeamForge-translation-packet-ko.zip \
            --expected-locale ko

      - name: Verify unregistered locale safety gate
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/build-translation-packet.py \
            --locale zz-ZZ \
            --output-dir dist-translation-test/refused; then
            echo 'Unregistered locale unexpectedly succeeded without --allow-unregistered.' >&2
            exit 1
          fi

          python3 scripts/build-translation-packet.py \
            --locale zz-ZZ \
            --allow-unregistered \
            --output-dir dist-translation-test/allowed
          python3 scripts/verify-translation-packet.py \
            dist-translation-test/allowed/TeamForge-translation-packet-zz-ZZ.zip \
            --expected-locale zz-ZZ

      - name: Verify packet does not contain translated Korean target text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          packet = Path('dist-translation-test/TeamForge-translation-packet-ko.zip')
          root = 'TeamForge-translation-packet-ko/'
          with zipfile.ZipFile(packet) as zf:
              homepage = json.loads(zf.read(root + 'HOMEPAGE_SOURCE.en.json'))
              demo = json.loads(zf.read(root + 'EDITOR_DEMO_SOURCE.en.json'))
              glossary = json.loads(zf.read(root + 'GLOSSARY_DRAFT.json'))

          assert all('target' not in item for item in homepage['anchors'])
          assert all(key == value for key, value in demo['exact'].items())
          assert all(key == value for key, value in demo['attributes'].items())
          assert all(item['target'] is None for item in glossary['terms'])
          print('Packet contains canonical English source/inventory only.')
          PY

      - name: Build and verify zh-Hans draft packet
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-translation-packet.py \
            --locale zh-Hans \
            --allow-unregistered \
            --output-dir dist-translation-artifact
          python3 scripts/verify-translation-packet.py \
            dist-translation-artifact/TeamForge-translation-packet-zh-Hans.zip \
            --expected-locale zh-Hans

      - name: Upload zh-Hans draft translation packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TeamForge-translation-packet-zh-Hans
          path: dist-translation-artifact/TeamForge-translation-packet-zh-Hans.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build and verify Qwen five-file zh-Hans profile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-qwen-artifact
          python3 scripts/build-qwen-translation-profile.py \
            --locale zh-Hans \
            --allow-unregistered \
            --output-dir dist-qwen-artifact

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('dist-qwen-artifact/TeamForge-Qwen-zh-Hans')
          expected = {
              'QWEN_TRANSLATION_BRIEF.md',
              'GLOSSARY_DRAFT.json',
              'HOMEPAGE_SOURCE.en.json',
              'EDITOR_DEMO_SOURCE.en.json',
              'SOURCE_MANIFEST.json',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)

          brief = (root / 'QWEN_TRANSLATION_BRIEF.md').read_text(encoding='utf-8')
          for marker in (
              'English is the only canonical semantic source',
              'early public preview',
              'FIELD BLOCKED',
              'no WebRTC transport',
              'no ICE negotiation',
              'no built-in STUN support',
              'no built-in TURN support',
              'no general relay transport',
              'no automatic NAT traversal',
              'OUTPUT_INSTRUCTIONS.md',
              'REVIEW_CHECKLIST.md',
              'Qwen delivery-profile output override',
              'homepage.zh-Hans.targets.json',
              'never emit an anchor `source` field',
          ):
              assert marker in brief, marker

          glossary = json.loads((root / 'GLOSSARY_DRAFT.json').read_text(encoding='utf-8'))
          homepage = json.loads((root / 'HOMEPAGE_SOURCE.en.json').read_text(encoding='utf-8'))
          demo = json.loads((root / 'EDITOR_DEMO_SOURCE.en.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          assert glossary['targetLocale'] == 'zh-Hans'
          assert homepage['sourceLocale'] == 'en'
          assert demo['sourceLocale'] == 'en'
          assert manifest['canonicalLocale'] == 'en'
          assert manifest['targetLocale'] == 'zh-Hans'
          assert manifest['translationPolicy']['existingTranslationsSemanticSource'] is False
          print('Qwen profile contains exactly five supported files and target-only homepage output instructions.')
          PY

      - name: Verify LLM output contract, source-drift rejection, and explicit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-output-test
          mkdir -p dist-output-test/raw

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_dir = Path('dist-qwen-artifact/TeamForge-Qwen-zh-Hans')
          out = Path('dist-output-test/raw')
          homepage = json.loads((source_dir / 'HOMEPAGE_SOURCE.en.json').read_text(encoding='utf-8'))
          demo = json.loads((source_dir / 'EDITOR_DEMO_SOURCE.en.json').read_text(encoding='utf-8'))
          glossary = json.loads((source_dir / 'GLOSSARY_DRAFT.json').read_text(encoding='utf-8'))

          homepage_targets = {
              'schemaVersion': 1,
              'sourceLocale': 'en',
              'targetLocale': 'zh-Hans',
              'target': 'homepage-targets',
              'fingerprint': homepage['fingerprint'],
              'metadata': dict(homepage['metadata']),
              'anchors': [
                  {'id': item['id'], 'target': item['source']}
                  for item in homepage['anchors']
              ],
          }
          (out / 'homepage.zh-Hans.targets.json').write_text(
              json.dumps(homepage_targets, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          demo_output = {
              'schemaVersion': 1,
              'locale': 'zh-Hans',
              'target': 'editor-demo',
              'inventoryReference': demo['inventoryReference'],
              'inventoryReferencePolicy': demo['inventoryReferencePolicy'],
              'exact': {key: key for key in demo['exact']},
              'attributes': {key: key for key in demo['attributes']},
              'terms': {
                  group: {key: key for key in values}
                  for group, values in demo['terms'].items()
              },
              'patterns': [],
              'fingerprint': demo['fingerprint'],
          }
          for item in demo['patterns']:
              placeholders = item['requiredPlaceholders']
              template = ' · '.join('{' + name + '}' for name in placeholders) or 'translated'
              demo_output['patterns'].append({
                  'source': item['source'],
                  'template': template,
                  'requiredPlaceholders': placeholders,
                  'mapGroups': item.get('mapGroups', {}),
              })
          (out / 'editor-demo.zh-Hans.json').write_text(
              json.dumps(demo_output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          glossary_output = {
              'schemaVersion': 1,
              'sourceLocale': 'en',
              'targetLocale': 'zh-Hans',
              'status': 'draft',
              'terms': [
                  {**item, 'target': item['source']}
                  for item in glossary['terms']
              ],
          }
          (out / 'glossary.zh-Hans.review.json').write_text(
              json.dumps(glossary_output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          python3 scripts/verify-translation-output.py \
            --source-dir dist-qwen-artifact/TeamForge-Qwen-zh-Hans \
            --homepage dist-output-test/raw/homepage.zh-Hans.targets.json \
            --demo dist-output-test/raw/editor-demo.zh-Hans.json \
            --glossary dist-output-test/raw/glossary.zh-Hans.review.json \
            --expected-locale zh-Hans \
            --normalized-output-dir dist-output-test/normalized

          python3 - <<'PY'
          import json
          from pathlib import Path

          normalized = Path('dist-output-test/normalized/homepage.zh-Hans.json')
          data = json.loads(normalized.read_text(encoding='utf-8'))
          data['anchors'][0]['source'] += ' '
          Path('dist-output-test/raw/homepage.zh-Hans.legacy-drift.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          if python3 scripts/verify-translation-output.py \
            --source-dir dist-qwen-artifact/TeamForge-Qwen-zh-Hans \
            --homepage dist-output-test/raw/homepage.zh-Hans.legacy-drift.json \
            --demo dist-output-test/raw/editor-demo.zh-Hans.json \
            --glossary dist-output-test/raw/glossary.zh-Hans.review.json \
            --expected-locale zh-Hans; then
            echo 'Homepage source drift unexpectedly passed strict verification.' >&2
            exit 1
          fi

          python3 scripts/verify-translation-output.py \
            --source-dir dist-qwen-artifact/TeamForge-Qwen-zh-Hans \
            --homepage dist-output-test/raw/homepage.zh-Hans.legacy-drift.json \
            --demo dist-output-test/raw/editor-demo.zh-Hans.json \
            --glossary dist-output-test/raw/glossary.zh-Hans.review.json \
            --expected-locale zh-Hans \
            --repair-homepage-source \
            --normalized-output-dir dist-output-test/repaired

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('dist-qwen-artifact/TeamForge-Qwen-zh-Hans/HOMEPAGE_SOURCE.en.json').read_text(encoding='utf-8'))
          repaired = json.loads(Path('dist-output-test/repaired/homepage.zh-Hans.json').read_text(encoding='utf-8'))
          report = json.loads(Path('dist-output-test/repaired/TRANSLATION_OUTPUT_VALIDATION.json').read_text(encoding='utf-8'))
          assert [item['source'] for item in repaired['anchors']] == [item['source'] for item in source['anchors']]
          assert report['homepage']['sourceDriftCount'] == 1
          assert report['homepage']['sourceRepairApplied'] is True
          print('Target-only output verified; legacy source drift rejected strictly and repaired only when explicit.')
          PY

      - name: Upload Qwen five-file zh-Hans profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TeamForge-Qwen-zh-Hans-5-files
          path: dist-qwen-artifact/TeamForge-Qwen-zh-Hans
          if-no-files-found: error
          retention-days: 14
