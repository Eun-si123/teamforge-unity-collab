name: Manual Kick WP5.1 Publisher

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch current WP5.1 publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch publisher on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-wp51-candidate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched current WP5.1 candidate publisher on main."
