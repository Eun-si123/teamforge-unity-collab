name: Kick WP5.1 r3 Publisher

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - '.github/workflows/publish-wp51-candidate.yml'
      - '.github/workflows/kick-wp51-r2-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch WP5.1 r3 publisher after merge
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch publisher on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-wp51-candidate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched Publish WP5.1 Candidate r3 on main."
