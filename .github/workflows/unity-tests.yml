name: Unity Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unity-project/**'
      - 'unity-package/**'
      - 'server/**'
      - '.github/workflows/unity-tests.yml'
  pull_request:
    paths:
      - 'unity-project/**'
      - 'unity-package/**'
      - 'server/**'
      - '.github/workflows/unity-tests.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: TeamForge Unity EditMode + Real Server E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked server dependencies
        run: npm run install:server

      - name: Start real TeamForge server and CI peer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/e2e

          TEAMFORGE_HOST=127.0.0.1 TEAMFORGE_PORT=5080 \
            node server/src/index.mjs > test-results/e2e/server.log 2>&1 &
          echo $! > test-results/e2e/server.pid

          server_ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health > test-results/e2e/health.json; then
              server_ready=1
              break
            fi
            if ! kill -0 "$(cat test-results/e2e/server.pid)" 2>/dev/null; then
              echo 'TeamForge server exited before becoming ready.'
              cat test-results/e2e/server.log
              exit 1
            fi
            sleep 0.5
          done

          if [ "$server_ready" -ne 1 ]; then
            echo 'Timed out waiting for TeamForge server health endpoint.'
            cat test-results/e2e/server.log
            exit 1
          fi

          node server/scripts/ci-presence-peer.mjs > test-results/e2e/peer.log 2>&1 &
          echo $! > test-results/e2e/peer.pid

          peer_ready=0
          for attempt in $(seq 1 60); do
            if [ -f test-results/e2e/peer-ready.json ]; then
              peer_ready=1
              break
            fi
            if ! kill -0 "$(cat test-results/e2e/peer.pid)" 2>/dev/null; then
              echo 'CI Peer B exited before becoming ready.'
              cat test-results/e2e/peer.log
              exit 1
            fi
            sleep 0.5
          done

          if [ "$peer_ready" -ne 1 ]; then
            echo 'Timed out waiting for CI Peer B.'
            cat test-results/e2e/peer.log
            exit 1
          fi

          cat test-results/e2e/health.json
          cat test-results/e2e/peer-ready.json

      - name: Run Unity EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-project
          unityVersion: 6000.3.21f1
          testMode: EditMode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: TeamForge Unity EditMode + E2E
          customParameters: -teamforgeCiE2E
          useHostNetwork: true

      - name: Verify CI peer observed Unity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f test-results/e2e/peer-saw-unity.json ]; then
            echo 'CI Peer B never observed the real Unity client through the TeamForge server.'
            cat test-results/e2e/peer.log || true
            cat test-results/e2e/server.log || true
            exit 1
          fi
          cat test-results/e2e/peer-saw-unity.json

      - name: Stop E2E processes
        if: always()
        shell: bash
        run: |
          for pid_file in test-results/e2e/peer.pid test-results/e2e/server.pid; do
            if [ -f "$pid_file" ]; then
              pid="$(cat "$pid_file")"
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            fi
          done
          sleep 1

      - name: Upload Unity and E2E test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-results
          path: |
            ${{ steps.tests.outputs.artifactsPath }}
            test-results/e2e
          if-no-files-found: warn
