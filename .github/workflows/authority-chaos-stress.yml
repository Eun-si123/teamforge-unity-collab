name: Authority Chaos Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/authority-chaos-stress.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/authority-chaos-stress.yml'

permissions:
  contents: read

concurrency:
  group: authority-chaos-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-chaos-stress:
    name: Multi-seed Authority Chaos Stress
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked server dependencies
        run: npm run install:server

      - name: Start short-lease TeamForge server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/authority-chaos-stress
          TEAMFORGE_HOST=127.0.0.1 TEAMFORGE_PORT=5080 TEAMFORGE_LOCK_LEASE_MS=3000 \
            node server/src/index.mjs > test-results/authority-chaos-stress/server.log 2>&1 &
          echo $! > test-results/authority-chaos-stress/server.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health > test-results/authority-chaos-stress/health.json; then
              exit 0
            fi
            if ! kill -0 "$(cat test-results/authority-chaos-stress/server.pid)" 2>/dev/null; then
              cat test-results/authority-chaos-stress/server.log
              exit 1
            fi
            sleep 0.5
          done
          cat test-results/authority-chaos-stress/server.log
          exit 1

      - name: Run deterministic multi-seed chaos matrix
        shell: bash
        run: |
          set -euo pipefail
          for seed in 12648430 3735928559 195936478; do
            echo "=== TeamForge authority chaos seed: $seed ==="
            TEAMFORGE_CHAOS_SEED="$seed" node server/scripts/ci-authority-chaos-stress-e2e.mjs
          done

      - name: Run deterministic recovery chaos matrix
        shell: bash
        run: |
          set -euo pipefail
          for seed in 12648430 3735928559 195936478; do
            echo "=== TeamForge authority recovery chaos seed: $seed ==="
            TEAMFORGE_CHAOS_SEED="$seed" node server/scripts/ci-authority-recovery-chaos-e2e.mjs
          done

      - name: Run lease-edge process-freeze chaos
        shell: bash
        run: |
          set -euo pipefail
          TEAMFORGE_CHAOS_LOCK_LEASE_MS=3000 node server/scripts/ci-lock-lease-freeze-chaos-e2e.mjs

      - name: Run parent-child authority chaos
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/ci-parent-child-authority-chaos-e2e.mjs

      - name: Run apply-ack disconnect chaos
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/ci-apply-ack-disconnect-chaos-e2e.mjs

      - name: Verify chaos evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join('test-results', 'authority-chaos-stress');
          const seeds = [12648430, 3735928559, 195936478];
          for (const seed of seeds) {
            const stress = JSON.parse(fs.readFileSync(path.join(dir, `authority-chaos-stress-${seed}.json`), 'utf8'));
            if (!stress.passed || stress.finalRevision !== 10 || !Array.isArray(stress.checks) || stress.checks.length < 30) throw new Error(`Stress seed ${seed} failed verification.`);
            const recovery = JSON.parse(fs.readFileSync(path.join(dir, `authority-recovery-chaos-${seed}.json`), 'utf8'));
            if (!recovery.passed || recovery.finalRevision !== 3 || !Array.isArray(recovery.checks) || recovery.checks.length < 14) throw new Error(`Recovery seed ${seed} failed verification.`);
            console.log(`seed=${seed} stressChecks=${stress.checks.length} recoveryChecks=${recovery.checks.length}`);
          }

          const freeze = JSON.parse(fs.readFileSync(path.join(dir, 'lock-lease-freeze-chaos.json'), 'utf8'));
          if (!freeze.passed || !Array.isArray(freeze.checks) || freeze.checks.length < 8) throw new Error(`Lease freeze chaos failed: ${freeze.error ?? 'insufficient evidence'}`);
          console.log(`leaseFreezeChecks=${freeze.checks.length} leaseMs=${freeze.leaseMs} grantAfterMs=${freeze.grantedAfterMs}`);

          const parentChild = JSON.parse(fs.readFileSync(path.join(dir, 'parent-child-authority-chaos.json'), 'utf8'));
          if (!parentChild.passed || !Array.isArray(parentChild.checks) || parentChild.checks.length < 7) throw new Error(`Parent-child chaos failed: ${parentChild.error ?? 'insufficient evidence'}`);
          console.log(`parentChildChecks=${parentChild.checks.length} finalRevision=${parentChild.finalRevision}`);

          const applyAck = JSON.parse(fs.readFileSync(path.join(dir, 'apply-ack-disconnect-chaos.json'), 'utf8'));
          if (!applyAck.passed || !Array.isArray(applyAck.trials) || applyAck.trials.length !== 8 || applyAck.committedTrials < 1) throw new Error(`Apply/ack disconnect chaos failed: ${applyAck.error ?? 'insufficient evidence'}`);
          console.log(`applyAckTrials=${applyAck.trials.length} committed=${applyAck.committedTrials} uncommitted=${applyAck.uncommittedTrials} finalRevision=${applyAck.finalRevision}`);
          NODE

      - name: Stop chaos server
        if: always()
        shell: bash
        run: |
          if [ -f test-results/authority-chaos-stress/server.pid ]; then
            pid="$(cat test-results/authority-chaos-stress/server.pid)"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
          fi
          sleep 1

      - name: Upload chaos stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authority-chaos-stress-results
          path: test-results/authority-chaos-stress
          if-no-files-found: warn
