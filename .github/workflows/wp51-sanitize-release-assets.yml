name: Sanitize WP5.1 release assets

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.5.1-prealpha-wp5.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sanitize and replace WP5.1 release assets
        run: python scripts/wp51-sanitize-release-assets.py
