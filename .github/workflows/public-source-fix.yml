name: Clean temporary source branches

on:
  push:
    branches:
      - public-source-fix
    paths:
      - '.github/workflows/public-source-fix.yml'

permissions:
  contents: write

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            public-source-direct-tree \
            public-source-direct-tree-test \
            public-source-direct-tree-test2 \
            public-source-final-check \
            public-source-fix-final \
            public-source-fix-stage \
            public-source-fix-work \
            public-source-pr \
            public-source-preview \
            public-source-review \
            public-source-review-copy \
            public-source-review-pr
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
