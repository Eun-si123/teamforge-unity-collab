name: Publish TeamForge Post-r9 Integration Candidate r10

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: publish-testlab-candidate-r10
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish post-r9 integration candidate r10
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_TAG: v0.5.1-prealpha-wp5.1-r10
      RELEASE_TITLE: TeamForge 0.5.1 WP5.1 Post-r9 Integration Candidate r10
      CANDIDATE_NAME: Unity-TeamForge-0.5.1-WP5.1-path-resilience-candidate-r10-win-x64.zip
      STAGED_ROOT_NAME: Unity-TeamForge-0.5.1-WP5.1

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify publication targets reviewed main and Test Lab
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'The r10 candidate may only be published from main after review.'
          }
          # A recovery candidate from an older main would be a misleading new ZIP.
          # Checkout uses fetch-depth: 0, so the original merged recovery commit
          # must be in the exact source ancestry before publication can proceed.
          $recoveryMerge = '5e986f20473ca9090314e490808863269eea95a8'
          git merge-base --is-ancestor $recoveryMerge $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Selected r10 source does not include the merged post-r7 recovery fixes.'
          }
          $labWindow = 'unity-package/com.eunsung.teamforge/Editor/Testing/TeamForgeTestLabWindow.cs'
          $labCheck = 'unity-package/com.eunsung.teamforge/Editor/Testing/TeamForgeTwoPcSmokeCheck.cs'
          $labTests = 'unity-package/com.eunsung.teamforge/Tests/Editor/TeamForgeTwoPcSmokeCheckTests.cs'
          foreach ($file in @($labWindow, $labCheck, $labTests)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Test Lab r10 source is missing required file: $file"
            }
          }
          if (-not (Select-String -LiteralPath $labWindow -SimpleMatch 'Two-PC Test Lab (inside Unity)' -Quiet)) {
            throw 'Test Lab Unity UI marker missing from candidate source.'
          }


      - name: Refuse to overwrite an existing r10 release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; its assets remain immutable."
          } else {
            # An absent Release is not permission to reuse an existing Git tag.
            $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify r10 tag absence.' }
            if (-not [string]::IsNullOrWhiteSpace(($existingTag | Out-String).Trim())) {
              throw "Tag $env:RELEASE_TAG already exists without a published Release."
            }
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Neither Release nor tag $env:RELEASE_TAG exists; building a fresh candidate."
          }
          exit 0

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup .NET 10 SDK
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.303'

      - name: Install pinned npm and validate source
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global npm@11.19.0
          if ((npm --version).Trim() -ne '11.19.0') { throw 'Pinned npm 11.19.0 was not selected.' }
          npm run install:all
          npm run validate

      - name: Download pinned Node runtime archive
        if: steps.existing.outputs.exists != 'true'
        id: node_runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'node-v24.19.0-win-x64.zip'
          $extractParent = Join-Path $env:RUNNER_TEMP 'teamforge-node-runtime'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extractParent
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.19.0/node-v24.19.0-win-x64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '57f71ab3652e797d84acddc79c81cc9ff1c6ddb2a1974cdb83f00fee9bff4c73'
          if ($actual -ne $expected) { throw "Pinned Node archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractParent
          $nodeRoot = Join-Path $extractParent 'node-v24.19.0-win-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $nodeRoot 'node.exe') -PathType Leaf)) {
            throw 'Pinned Node runtime did not extract to the expected directory.'
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "root=$nodeRoot" >> $env:GITHUB_OUTPUT

      - name: Build and verify packaged Runtime and Windows Launcher
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          NODE_ARCHIVE: ${{ steps.node_runtime.outputs.archive }}
          NODE_ROOT: ${{ steps.node_runtime.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/build-runtime-bundle.mjs --node-root $env:NODE_ROOT --node-archive $env:NODE_ARCHIVE
          node scripts/verify-runtime-bundle.mjs --packaged
          node scripts/build-launcher.mjs
          node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-publish-verify-r10')
          dotnet run --project launcher/tests/TeamForge.Launcher.Core.Tests/TeamForge.Launcher.Core.Tests.csproj -c Release
          dotnet run --project launcher/tests/TeamForge.Diagnostics.Tests/TeamForge.Diagnostics.Tests.csproj -c Release
          npm run validate:release

      - name: Stage and validate exact candidate tree
        if: steps.existing.outputs.exists != 'true'
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stageRoot = Join-Path $env:RUNNER_TEMP $env:STAGED_ROOT_NAME
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stageRoot
          node scripts/stage-release.mjs --staging $stageRoot

          Push-Location $stageRoot
          try {
            node scripts/validate-public-source.mjs
            node scripts/verify-runtime-bundle.mjs --packaged
            node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-staged-verify-r10')
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stageRoot 'release-manifest.json') -PathType Leaf)) {
            throw 'Staging completed without release-manifest.json.'
          }
          "root=$stageRoot" >> $env:GITHUB_OUTPUT

      - name: Create immutable ZIP and SHA-256 sidecar
        if: steps.existing.outputs.exists != 'true'
        id: archive
        shell: pwsh
        env:
          STAGE_ROOT: ${{ steps.stage.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:RUNNER_TEMP 'teamforge-release-r10'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $publishRoot
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          $zip = Join-Path $publishRoot $env:CANDIDATE_NAME
          Compress-Archive -LiteralPath $env:STAGE_ROOT -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $sidecar = "$zip.sha256"
          "$hash  $env:CANDIDATE_NAME" | Set-Content -Encoding ascii -NoNewline -LiteralPath $sidecar
          Write-Host "Candidate SHA-256: $hash"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sidecar=$sidecar" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Generate build provenance attestation
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.zip }}

      - name: Verify exact local ZIP before publication
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File scripts/verify-current-release-archive.ps1 -ArchivePath $env:ZIP_PATH
          if ($LASTEXITCODE -ne 0) { throw "Local archive verification failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub pre-release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
          SIDECAR_PATH: ${{ steps.archive.outputs.sidecar }}
          CANDIDATE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $notes = Join-Path $env:RUNNER_TEMP 'teamforge-wp51-r10-release-notes.md'
          $lines = @(
            '## TeamForge 0.5.1 — Post-r9 Integration Candidate r10',
            '',
            "This is a **pre-release / FIELD_BLOCKED** Windows x64 candidate built from main commit $env:GITHUB_SHA.",
            '',
            '### Changes since r9 relevant to this test candidate',
            '- Incorporates current main source and the approved integration of PR #405, #410, #411, and #434.',
            '- Guest state marker startup concurrency and ownership checks (#405).',
            '- Rejecting Coordinator reuse when its access code changes without an explicit stop (#410).',
            '- Rejecting oversized cached transfer chunks before unbounded read (#411).',
            '- Cleaning up owned Direct/Publishing Seed child processes on startup failure and cancellation (#434).',
            '- Retains the r9 two-PC Unity Test Lab smoke panel and prior packaged Host/Guest flow.',
            '',
            '### Evidence boundaries',
            '- CI, source tests, package verification, and two physical Windows PCs are distinct evidence.',
            '- This packaged candidate is for controlled testing on disposable/backed-up Unity projects.',
            '- No general availability, automatic NAT traversal/relay, complete Component/Prefab/Asset synchronization, or durable server restart recovery is claimed.',
            '- Physical Host/Guest full failure-path release gate remains FIELD_BLOCKED.',
            '',
            '### Packaging',
            '- Product version: 0.5.1',
            '- Release lineage: 0.5.1-wp5.1-path-resilience',
            '- Target: Windows x64 / Unity 6000.3.x (recorded CI editor: 6000.3.21f1)',
            '- Bundled Node: 24.19.0; Launcher: self-contained .NET 10 Windows build',
            "New immutable r10 ZIP SHA-256: $env:CANDIDATE_SHA256",
            '',
            'The existing r9 ZIP and its historical SHA-256 remain unchanged.',
            'Exact r10 Release validation is dispatched separately after publication.'
          )
          $lines -join "`n" | Set-Content -Encoding utf8 -LiteralPath $notes

          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file $notes `
            --prerelease `
            $env:ZIP_PATH `
            $env:SIDECAR_PATH

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,name,isPrerelease,targetCommitish,url,assets

      - name: Dispatch exact r10 Release validation
        if: steps.existing.outputs.exists == 'true' || success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh workflow run release-validation.yml --repo $env:GITHUB_REPOSITORY --ref main -f release_tag=$env:RELEASE_TAG
          Write-Host "Dispatched exact r10 Release validation for $env:RELEASE_TAG."

      - name: Upload publication evidence
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp51-r10-publication-evidence
          path: |
            ${{ steps.archive.outputs.sidecar }}
            ${{ steps.stage.outputs.root }}/release-manifest.json
          if-no-files-found: error
