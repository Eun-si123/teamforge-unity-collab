name: GitHub NVIDIA agent adapter tests

on:
  pull_request:
    paths:
      - 'github-agent/**'
      - '.github/workflows/github-nvidia-agent.yml'
  push:
    branches: [main]
    paths:
      - 'github-agent/**'
      - '.github/workflows/github-nvidia-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --check github-agent/omniroute-github.mjs
      - run: node --test github-agent/omniroute-github.test.mjs github-agent/harness-core.test.mjs github-agent/opencode-harness.test.mjs
      - run: node --check github-agent/harness-core.mjs
      - run: node --check github-agent/harness-runner.mjs
      - run: node --check github-agent/opencode-core.mjs
      - run: node --check github-agent/opencode-runner.mjs
