name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Deploy TeamForge website"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Select changed indexable HTML URLs
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          # Compare against the last successful MAIN Pages push, not HEAD^.
          # This covers multi-commit pushes and skipped/failed deployments.
          previous="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=100" \
            | jq -r --argjson current "${DEPLOY_RUN_NUMBER}" '
                [.workflow_runs[] | select(.event == "push" and .run_number < $current)]
                | if length > 0 then max_by(.run_number).head_sha else empty end
              ')"
          if [[ -n "${previous}" ]] &&
             git cat-file -e "${previous}^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "${previous}" "${DEPLOYED_SHA}"; then
            python3 scripts/select-indexnow-urls.py \
              --base "${previous}" --head "${DEPLOYED_SHA}" \
              > "${RUNNER_TEMP}/indexnow-urls.json"
          else
            if [[ -n "${previous}" ]]; then
              echo "::warning::Previous Pages commit unavailable or nonancestor; selecting all indexable HTML URLs."
            else
              echo "No earlier successful Pages push found; bootstrap indexable HTML URLs."
            fi
            python3 scripts/select-indexnow-urls.py --all \
              > "${RUNNER_TEMP}/indexnow-urls.json"
          fi
          jq -e 'type == "array" and all(.[]; startswith("https://eun-si123.github.io/teamforge-unity-collab/") and endswith("/"))' \
            "${RUNNER_TEMP}/indexnow-urls.json" > /dev/null
          count="$(jq 'length' "${RUNNER_TEMP}/indexnow-urls.json")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${count} changed indexable HTML page(s):"
          jq -r '.[]' "${RUNNER_TEMP}/indexnow-urls.json"

      - name: Verify deployed IndexNow key
        if: steps.select.outputs.count != '0'
        shell: bash
        env:
          INDEXNOW_KEY: 469ca86bcd5445fc4dc6316f8a685e9c
          KEY_LOCATION: https://eun-si123.github.io/teamforge-unity-collab/469ca86bcd5445fc4dc6316f8a685e9c.txt
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${KEY_LOCATION}")"
          actual="${actual//$'\r'/}"
          actual="${actual//$'\n'/}"
          if [[ "${actual}" != "${INDEXNOW_KEY}" ]]; then
            echo "IndexNow key file mismatch at ${KEY_LOCATION}" >&2
            exit 1
          fi
          echo "Deployed IndexNow key verified."

      - name: Notify IndexNow about changed public HTML pages
        if: steps.select.outputs.count != '0'
        shell: bash
        env:
          INDEXNOW_KEY: 469ca86bcd5445fc4dc6316f8a685e9c
          INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
          KEY_LOCATION: https://eun-si123.github.io/teamforge-unity-collab/469ca86bcd5445fc4dc6316f8a685e9c.txt
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg host 'eun-si123.github.io' \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "${KEY_LOCATION}" \
            --slurpfile urls "${RUNNER_TEMP}/indexnow-urls.json" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urls[0]}')"

          http_code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output /tmp/indexnow-response \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "${payload}" \
            "${INDEXNOW_ENDPOINT}")"

          if [[ -s /tmp/indexnow-response ]]; then
            cat /tmp/indexnow-response
            echo
          fi

          case "${http_code}" in
            200)
              echo "IndexNow accepted changed HTML URLs (HTTP 200)."
              ;;
            202)
              echo "IndexNow received changed HTML URLs; key validation pending (HTTP 202)."
              ;;
            *)
              echo "IndexNow submission failed with HTTP ${http_code}." >&2
              exit 1
              ;;
          esac
