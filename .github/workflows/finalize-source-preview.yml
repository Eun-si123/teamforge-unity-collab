name: Finalize source preview docs

on:
  push:
    branches:
      - public-source-fix
    paths:
      - '.github/workflows/finalize-source-preview.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Korean source status
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.ko.md')
          text = path.read_text(encoding='utf-8')

          old_warning = 'TeamForge는 현재 적극적으로 개발 중입니다. 개발 환경에서는 프로토타입 기능들이 작동하고 있지만, **전체 개발 소스와 공개 Alpha는 아직 이 저장소에 공개되지 않았습니다.** 중요한 Unity 프로젝트의 유일한 사본에 TeamForge를 의존하지 마세요.'
          new_warning = 'TeamForge는 현재 적극적으로 개발 중입니다. 현재 실험 단계의 소스는 **테스트, 검토, 보안 피드백 및 기여를 위해 공개되어 있지만, 설치 가능한 공개 Alpha는 아직 준비되지 않았습니다.** 중요한 Unity 프로젝트의 유일한 사본에 TeamForge를 의존하지 마세요.'
          if text.count(old_warning) != 1:
              raise SystemExit('Expected stale warning exactly once')
          text = text.replace(old_warning, new_warning, 1)

          demo = '두 Unity Editor 인스턴스가 TeamForge로 연결되어 Editor 변경 사항을 실시간으로 공유하는 개발 중 프로토타입 영상입니다.\n\n'
          source_section = '''두 Unity Editor 인스턴스가 TeamForge로 연결되어 Editor 변경 사항을 실시간으로 공유하는 개발 중 프로토타입 영상입니다.\n\n## 소스 프리뷰\n\n현재 실험 단계의 TeamForge 소스는 **테스트, 검토, 보안 피드백 및 기여**를 위해 이 저장소에 공개되어 있습니다. 아직 완성된 릴리스가 아닌 초기 프리뷰입니다.\n\n소스 구조, 현재 제한사항과 검토 안내는 **[docs/SOURCE.md](docs/SOURCE.md)** 에서 시작할 수 있습니다. 주요 영역은 다음과 같습니다.\n\n- `unity-package/com.eunsung.teamforge/` — Unity Editor 패키지 소스와 Editor 테스트\n- `server/` — TeamForge coordination/session 서버 소스와 테스트\n- `project-peer/` — 프로젝트 bootstrap / P2P 도구와 테스트\n- `launcher/` — Launcher 소스\n- `scripts/` — 개발 및 검증 도구\n\n'''
          if '## 소스 프리뷰' not in text:
              if text.count(demo) != 1:
                  raise SystemExit('Expected demo paragraph exactly once')
              text = text.replace(demo, source_section, 1)

          old_license = '전체 개발 소스는 공개 전에 아직 정리 및 검토 중입니다. 현재 저장소는 문서, 데모, 피드백, 라이선스, 기여 가이드, 개발 방향을 위한 공개 프로젝트 홈 역할을 합니다.'
          new_license = '현재 실험 단계의 개발 소스는 이 저장소에 공개되어 있습니다. 다만 아직 설치 가능한 공개 Alpha나 프로덕션 사용을 위한 완성된 릴리스는 아니며, 외부 검토와 실제 환경 테스트가 계속 필요합니다.'
          if text.count(old_license) != 1:
              raise SystemExit('Expected stale license paragraph exactly once')
          text = text.replace(old_license, new_license, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit final docs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-source-preview.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align Korean README with public source preview'
          git push origin HEAD:public-source-fix
