name: Published candidate drift guard

on:
  pull_request:
    paths:
      - 'builds/README.md'
      - 'docs/STATUS.md'
      - 'scripts/validate-published-candidate.mjs'
      - 'package.json'
      - '.github/workflows/published-candidate-drift.yml'
  push:
    branches: [main]
    paths:
      - 'builds/README.md'
      - 'docs/STATUS.md'
      - 'scripts/validate-published-candidate.mjs'
      - 'package.json'
      - '.github/workflows/published-candidate-drift.yml'
  release:
    types: [published, edited, prereleased, released]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compare repository metadata with live GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate current published candidate against live Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-published-candidate.mjs --live
