name: Deploy TeamForge website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build website and agent-readable mirrors
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf .pages-site
          cp -R site .pages-site
          cp llms.txt .pages-site/llms.txt
          cp release-contract.json .pages-site/release-contract.json

          cp README.md .pages-site/readme.txt
          cp README.ko.md .pages-site/readme.ko.txt
          cp docs/STATUS.md .pages-site/status.txt
          cp docs/STATUS.ko.md .pages-site/status.ko.txt
          cp CODEMAP.md .pages-site/codemap.txt
          cp docs/ROADMAP.md .pages-site/roadmap.txt
          cp docs/ROADMAP.ko.md .pages-site/roadmap.ko.txt
          cp docs/SOURCE.md .pages-site/source.txt
          cp docs/AI_COMMENT_AUDIT.md .pages-site/comment-audit.txt
          cp docs/AI_DISCOVERY.md .pages-site/ai-discovery.txt
          cp docs/architecture.md .pages-site/architecture-overview.txt
          cp docs/architecture-decisions.md .pages-site/architecture.txt
          cp .github/SECURITY.md .pages-site/security.txt
          cp .github/CONTRIBUTING.md .pages-site/contributing.txt
          cp .github/SUPPORT.md .pages-site/support.txt
          cp .github/CODE_OF_CONDUCT.md .pages-site/code-of-conduct.txt
          cp AUTHORS.md .pages-site/authors.txt
          cp NOTICE .pages-site/notice.txt

          mkdir -p .pages-site/modules
          cp unity-package/com.eunsung.teamforge/README.md .pages-site/modules/unity-package.txt
          cp server/README.md .pages-site/modules/server.txt
          cp project-peer/README.md .pages-site/modules/project-peer.txt
          cp launcher/README.md .pages-site/modules/launcher.txt

          {
            cat CHANGELOG.md
            printf '\n\n---\n\n# Detailed Unity package changelog\n\n'
            cat unity-package/com.eunsung.teamforge/CHANGELOG.md
          } > .pages-site/changelog.txt

          mkdir -p .pages-site/history/phases .pages-site/history/work-state

          {
            echo '# TeamForge phase notes index'
            echo
            echo '> Historical development records. Prefer status.txt, release-contract.json, and changelog.txt for current project facts.'
            echo
            for f in docs/phases/*.md; do
              base="$(basename "$f" .md)"
              printf -- '- [%s](https://eun-si123.github.io/teamforge-unity-collab/history/phases/%s.txt)\n' "$base" "$base"
              {
                printf '# Historical TeamForge phase note: %s\n\n' "$base"
                echo '> Historical record. It may contain assumptions or plans superseded by newer status, release-contract, changelog, or architecture documentation.'
                echo
                cat "$f"
              } > ".pages-site/history/phases/$base.txt"
            done
          } > .pages-site/history/phases/index.txt

          {
            echo '# TeamForge work-state notes index'
            echo
            echo '> Raw historical engineering notes. These may be rough, partially superseded, or describe experiments that later changed. Prefer project.json, release-contract.json, status.txt, codemap.txt, module guides, and changelog.txt for current facts.'
            echo
            for f in docs/work-state/*.md; do
              base="$(basename "$f" .md)"
              printf -- '- [%s](https://eun-si123.github.io/teamforge-unity-collab/history/work-state/%s.txt)\n' "$base" "$base"
              {
                printf '# Historical TeamForge work-state note: %s\n\n' "$base"
                echo '> Raw historical engineering record. This file may be incomplete or superseded; do not treat it as the current project state without checking status.txt, release-contract.json, and changelog.txt.'
                echo
                cat "$f"
              } > ".pages-site/history/work-state/$base.txt"
            done
          } > .pages-site/history/work-state/index.txt

          {
            echo '# TeamForge — full AI-readable project context'
            echo
            echo '> Generated from canonical repository documentation during GitHub Pages deployment. Historical raw work-state notes and the full source tree are intentionally not inlined here; use repository-manifest.json when you need exhaustive discovery.'
            echo
            printf '\n\n---\n\n<!-- source: release-contract.json -->\n\n```json\n'
            cat release-contract.json
            printf '```\n'
            for f in README.md docs/STATUS.md CODEMAP.md docs/architecture.md CHANGELOG.md unity-package/com.eunsung.teamforge/CHANGELOG.md docs/ROADMAP.md docs/SOURCE.md docs/AI_COMMENT_AUDIT.md docs/AI_DISCOVERY.md docs/architecture-decisions.md .github/SECURITY.md .github/CONTRIBUTING.md .github/SUPPORT.md unity-package/com.eunsung.teamforge/README.md server/README.md project-peer/README.md launcher/README.md; do
              printf '\n\n---\n\n<!-- source: %s -->\n\n' "$f"
              cat "$f"
            done
          } > .pages-site/llms-full.txt

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          package = json.loads(Path('unity-package/com.eunsung.teamforge/package.json').read_text(encoding='utf-8'))
          release = json.loads(Path('release-contract.json').read_text(encoding='utf-8'))
          if package.get('version') != release.get('productVersion'):
              raise SystemExit('Unity package version and release-contract.json productVersion disagree')

          status_text = Path('docs/STATUS.md').read_text(encoding='utf-8')
          match = re.search(r'^> \*\*(.+?) — (.+?)\*\*$', status_text, flags=re.MULTILINE)
          if not match:
              raise SystemExit('docs/STATUS.md must contain a bold status line such as Early Public Preview — summary')
          status_label = match.group(1).strip()
          status_summary = match.group(2).strip().rstrip('.')
          status_slug = re.sub(r'[^a-z0-9]+', '-', status_label.lower()).strip('-')

          unity_version = str(package.get('unity') or '').strip()
          if not unity_version:
              raise SystemExit('Unity package metadata is missing unity version')
          marketing = re.search(r'Unity\s+([0-9.]+\s+LTS)', str(package.get('description') or ''))
          runtime_display = f"Unity {marketing.group(1)} Editor" if marketing else f"Unity {unity_version} Editor"

          source_commit = os.environ.get('GITHUB_SHA')
          if not source_commit:
              source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          source_date = subprocess.check_output(['git', 'show', '-s', '--format=%cI', source_commit], text=True).strip()

          base = 'https://eun-si123.github.io/teamforge-unity-collab/'
          data = {
              'schemaVersion': 6,
              'name': 'TeamForge',
              'nameStatus': 'working-name',
              'packageName': package['name'],
              'version': release['productVersion'],
              'releaseId': release['releaseId'],
              'workPackage': release['workPackage'],
              'releaseState': release['status'],
              'target': release['target'],
              'protocols': release['protocols'],
              'unityVersion': unity_version,
              'testedUnityEditor': release['unity']['testedEditor'],
              'runtimeDisplay': runtime_display,
              'bundledNodeVersion': release['node']['version'],
              'status': status_slug,
              'statusLabel': status_label,
              'statusSummary': status_summary,
              'languages': ['C#', 'JavaScript'],
              'license': {
                  'spdx': package.get('license'),
                  'url': 'https://www.gnu.org/licenses/agpl-3.0.html',
              },
              'maintainer': 'Eun-si123 / BlackProtogen',
              'website': base,
              'repository': 'https://github.com/Eun-si123/teamforge-unity-collab',
              'sourceCommit': source_commit,
              'sourceDate': source_date,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'documentation': {
                  'llms': base + 'llms.txt',
                  'fullContext': base + 'llms-full.txt',
                  'projectMetadata': base + 'project.json',
                  'releaseContract': base + 'release-contract.json',
                  'repositoryManifest': base + 'repository-manifest.json',
                  'semanticSitemap': base + 'sitemap.md',
                  'readme': base + 'readme.txt',
                  'status': base + 'status.txt',
                  'codeMap': base + 'codemap.txt',
                  'architectureOverview': base + 'architecture-overview.txt',
                  'changelog': base + 'changelog.txt',
                  'roadmap': base + 'roadmap.txt',
                  'sourceGuide': base + 'source.txt',
                  'commentAudit': base + 'comment-audit.txt',
                  'aiDiscovery': base + 'ai-discovery.txt',
                  'architectureDecisions': base + 'architecture.txt',
                  'security': base + 'security.txt',
                  'contributing': base + 'contributing.txt',
                  'support': base + 'support.txt',
                  'codeOfConduct': base + 'code-of-conduct.txt',
                  'authors': base + 'authors.txt',
                  'notice': base + 'notice.txt',
                  'phaseNotes': base + 'history/phases/index.txt',
                  'workStateNotes': base + 'history/work-state/index.txt',
              },
              'localizedDocumentation': {
                  'ko': {
                      'readme': base + 'readme.ko.txt',
                      'status': base + 'status.ko.txt',
                      'roadmap': base + 'roadmap.ko.txt',
                  },
              },
              'modules': {
                  'unityPackage': {
                      'role': 'Unity Editor client, realtime collaboration services, Host UX and Editor tests',
                      'source': 'unity-package/com.eunsung.teamforge/',
                      'guide': base + 'modules/unity-package.txt',
                  },
                  'server': {
                      'role': 'Authoritative realtime/session coordinator and signed Project metadata coordination',
                      'source': 'server/',
                      'guide': base + 'modules/server.txt',
                  },
                  'projectPeer': {
                      'role': 'Direct Project Transfer v1, Host/Guest orchestration, trust and activation backend',
                      'source': 'project-peer/',
                      'guide': base + 'modules/project-peer.txt',
                  },
                  'launcher': {
                      'role': 'Windows Guest Launcher, verified bundled runtime, diagnostics/path resilience, trust UX and Unity handoff',
                      'source': 'launcher/',
                      'guide': base + 'modules/launcher.txt',
                  },
              },
          }
          Path('.pages-site/project.json').write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

          python3 scripts/build-repository-manifest.py . .pages-site
          python3 scripts/build-agent-web.py .pages-site
          python3 scripts/build-update-feeds.py . .pages-site
          python3 scripts/add-update-feed-discovery.py .pages-site
          python3 scripts/build-sitemap.py . .pages-site

      - name: Verify agent-readable outputs and discovery coverage
        shell: bash
        run: |
          set -euo pipefail
          cmp -s llms.txt .pages-site/llms.txt
          cmp -s release-contract.json .pages-site/release-contract.json
          cmp -s CODEMAP.md .pages-site/codemap.txt
          cmp -s docs/AI_COMMENT_AUDIT.md .pages-site/comment-audit.txt
          cmp -s docs/AI_DISCOVERY.md .pages-site/ai-discovery.txt
          python3 -m json.tool .pages-site/project.json >/dev/null
          python3 -m json.tool .pages-site/release-contract.json >/dev/null
          python3 -m json.tool .pages-site/repository-manifest.json >/dev/null
          python3 scripts/verify-agent-site.py . .pages-site
          python3 scripts/verify-update-feeds.py . .pages-site
          grep -Fq 'Retrieval and evidence contract' .pages-site/llms.txt
          grep -Fq 'LLM reading guide' .pages-site/source.txt
          grep -Fq 'Start here by question' .pages-site/codemap.txt
          grep -Fq 'Detailed Unity package changelog' .pages-site/changelog.txt
          grep -Fq 'releaseId' .pages-site/project.json
          grep -Fq 'releaseContract' .pages-site/project.json
          grep -Fq 'repositoryManifest' .pages-site/project.json
          grep -Fq 'Current project facts &amp; AI/search access' .pages-site/index.html
          grep -Fq 'release-contract.json' .pages-site/index.html
          grep -Fq 'repository-manifest.json' .pages-site/index.html
          grep -Fq 'application/atom+xml' .pages-site/index.html
          grep -Fq 'application/rss+xml' .pages-site/index.html
          grep -Fq 'feed.atom' .pages-site/sitemap.md
          grep -Fq 'feed.xml' .pages-site/sitemap.md
          grep -Fq 'SoftwareSourceCode' .pages-site/index.html
          grep -Fq 'TeamForge semantic sitemap' .pages-site/sitemap.md

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke-test live agent/search endpoints
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          paths=(
            ""
            "status/"
            "architecture/"
            "source/"
            "changelog/"
            "security/"
            "llms.txt"
            "llms-full.txt"
            "project.json"
            "release-contract.json"
            "repository-manifest.json"
            "sitemap.xml"
            "sitemap.md"
            "feed.atom"
            "feed.xml"
            "readme.txt"
            "status.txt"
            "codemap.txt"
            "source.txt"
            "changelog.txt"
            "architecture-overview.txt"
            "architecture.txt"
            "security.txt"
            "ai-discovery.txt"
            "comment-audit.txt"
            "modules/unity-package.txt"
            "modules/server.txt"
            "modules/project-peer.txt"
            "modules/launcher.txt"
          )
          for path in "${paths[@]}"; do
            url="${base}${path}"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --output /tmp/teamforge-smoke-body "${url}"
            test -s /tmp/teamforge-smoke-body
          done

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${base}project.json" > /tmp/teamforge-project.json
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${base}release-contract.json" > /tmp/teamforge-release-contract.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          project = json.loads(Path('/tmp/teamforge-project.json').read_text(encoding='utf-8'))
          release = json.loads(Path('/tmp/teamforge-release-contract.json').read_text(encoding='utf-8'))
          expected_commit = os.environ['GITHUB_SHA']
          actual_commit = project.get('sourceCommit')
          if actual_commit != expected_commit:
              raise SystemExit(f'live project.json is stale: expected {expected_commit}, got {actual_commit}')

          expected_fields = {
              'version': release.get('productVersion'),
              'releaseId': release.get('releaseId'),
              'workPackage': release.get('workPackage'),
              'releaseState': release.get('status'),
              'target': release.get('target'),
              'protocols': release.get('protocols'),
              'testedUnityEditor': (release.get('unity') or {}).get('testedEditor'),
              'bundledNodeVersion': (release.get('node') or {}).get('version'),
          }
          for key, expected in expected_fields.items():
              actual = project.get(key)
              if actual != expected:
                  raise SystemExit(f'live project/release drift for {key}: expected {expected!r}, got {actual!r}')

          print(
              'Live Pages source/release verified: '
              f"{actual_commit} / {project.get('releaseId')} / {project.get('releaseState')}"
          )
          PY