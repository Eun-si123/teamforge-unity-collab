name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE" "$PR_HEAD" > changed-files.txt
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" > changed-files.txt
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          heavy=false
          if [[ ! -s changed-files.txt ]]; then
            heavy=true
          else
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                *) heavy=true; break ;;
              esac
            done < changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt || true
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  source-contract:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Public source contract (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate GitHub Actions policy
        run: npm run validate:workflows

      - name: Validate Test Lab scenario contract
        run: npm run testlab:validate

      - name: Validate public source and current documentation contract
        run: npm run validate

      - name: Verify localized document reviewed-source pins
        run: python3 scripts/verify_localized_doc_revisions.py .

  server:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Server (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install locked server dependencies
        run: npm run install:server

      - name: Syntax and source checks
        run: npm --prefix server run check

      - name: Run tests
        run: npm --prefix server test

      - name: Measure coverage (informational)
        continue-on-error: true
        run: |
          mkdir -p test-results/coverage
          npm --prefix server run test:coverage > test-results/coverage/server.lcov

      - name: Upload server coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-node24-coverage
          path: test-results/coverage/server.lcov
          if-no-files-found: warn

  project-peer:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Project Peer (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            project-peer/package-lock.json

      - name: Install locked integration dependencies
        run: npm run install:all

      - name: Source and policy checks
        run: npm --prefix project-peer run check

      - name: Run tests
        run: npm --prefix project-peer test

      - name: Measure coverage (informational)
        continue-on-error: true
        run: |
          mkdir -p test-results/coverage
          npm --prefix project-peer run test:coverage > test-results/coverage/project-peer.lcov

      - name: Upload Project Peer coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-peer-node24-coverage
          path: test-results/coverage/project-peer.lcov
          if-no-files-found: warn

  server-node22:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Server compatibility (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install locked server dependencies
        run: npm run install:server

      - name: Syntax and source checks
        run: npm --prefix server run check

      - name: Run tests
        run: npm --prefix server test

  project-peer-node22:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Project Peer compatibility (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            project-peer/package-lock.json

      - name: Install locked integration dependencies
        run: npm run install:all

      - name: Source and policy checks
        run: npm --prefix project-peer run check

      - name: Run tests
        run: npm --prefix project-peer test

  project-peer-windows-identity:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Project Peer identity recovery (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '22.23.2']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: project-peer/package-lock.json

      - name: Install locked Project Peer dependencies
        run: npm run install:peer

      - name: Source and policy checks
        run: npm --prefix project-peer run check

      - name: Run Project identity concurrency and crash recovery tests
        run: node --test --test-reporter=spec project-peer/test/project-identity-concurrency.test.mjs

  launcher-js:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Launcher runtime loader (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Check runtime loader syntax
        run: node --check launcher/runtime-loader.mjs

      - name: Check site locale runtime syntax
        run: |
          node --check site/locale-picker.js
          node --check site/editor-demo-localize.js

      - name: Run locale picker behavior tests
        run: node --test --test-reporter=spec site/locale-picker.test.mjs site/i18n.test.mjs

      - name: Run runtime loader tests
        run: node --test --test-reporter=spec launcher/test/runtime-loader.test.mjs

  launcher-dotnet:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    name: Launcher (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.303'

      - name: Run launcher core tests
        run: dotnet run --project launcher/tests/TeamForge.Launcher.Core.Tests/TeamForge.Launcher.Core.Tests.csproj -c Release

      - name: Run diagnostics support bundle safety tests
        run: dotnet run --project launcher/tests/TeamForge.Diagnostics.Tests/TeamForge.Diagnostics.Tests.csproj -c Release

      - name: Restore Windows launcher
        run: dotnet restore launcher/src/TeamForge.Launcher/TeamForge.Launcher.csproj -r win-x64

      - name: Build Windows launcher
        run: dotnet build launcher/src/TeamForge.Launcher/TeamForge.Launcher.csproj -c Release -r win-x64 --self-contained true --no-restore
