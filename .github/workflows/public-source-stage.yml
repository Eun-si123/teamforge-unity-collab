name: Public source staging test
on:
  push:
    branches: [public-source-preview]
permissions:
  contents: write
jobs:
  test-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-source-preview
      - name: Test branch write
        shell: bash
        run: |
          set -euo pipefail
          printf 'GitHub Actions branch write verified.\n' > .source-action-ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-action-ok
          git commit -m 'chore: verify public source staging write'
          git push origin HEAD:public-source-preview
