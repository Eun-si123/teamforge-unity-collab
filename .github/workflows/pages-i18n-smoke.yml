name: Pages i18n smoke

on:
  workflow_run:
    workflows: ["Deploy TeamForge website"]
    types: [completed]

permissions:
  contents: read

jobs:
  localized-pages:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live locale registry, pages, documents, runtime bundles, and shared assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://eun-si123.github.io/teamforge-unity-collab/"

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${base}i18n/locales.json" > /tmp/teamforge-locales.json

          python3 - <<'PY' > /tmp/teamforge-locales.tsv
          import json
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          assert registry.get("schemaVersion") == 1
          default = registry.get("defaultLocale")
          locales = registry.get("locales")
          assert isinstance(locales, list) and locales
          assert any(item.get("code") == default for item in locales)
          for item in locales:
              if not item.get("publish", True):
                  continue
              print(
                  item["code"],
                  item.get("path") or "__ROOT__",
                  item["htmlLang"],
                  item["hreflang"],
                  "1" if item.get("indexable", True) else "0",
                  item.get("direction", "ltr"),
                  sep="\t",
              )
          PY

          while IFS=$'\t' read -r code path html_lang hreflang indexable direction; do
            if [[ "${path}" == "__ROOT__" ]]; then path=""; fi
            url="${base}${path}"
            file="/tmp/teamforge-locale-${code//[^A-Za-z0-9_-]/_}.html"
            echo "Checking locale homepage ${code}: ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              "${url}" > "${file}"
            test -s "${file}"

            python3 - "${file}" "${code}" "${path}" "${html_lang}" "${direction}" <<'PY'
          import html
          import json
          import re
          import sys
          from urllib.parse import urlparse

          page_path, code, path, html_lang, direction = sys.argv[1:]
          base = "https://eun-si123.github.io/teamforge-unity-collab/"
          page = open(page_path, encoding="utf-8").read()
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          published = [item for item in registry["locales"] if item.get("publish", True)]
          default = next(item for item in published if item["code"] == registry["defaultLocale"])

          assert re.search(
              rf'<html\s+lang="{re.escape(html.escape(html_lang, quote=True))}"(?:\s|>)',
              page,
          ), f"{code}: wrong html lang"
          if direction == "rtl":
              assert re.search(
                  rf'<html\s+lang="{re.escape(html.escape(html_lang, quote=True))}"[^>]*\sdir="rtl"',
                  page,
              ), f"{code}: rtl direction missing"

          canonical = base + path
          assert f'<link rel="canonical" href="{canonical}">' in page, f"{code}: canonical mismatch"

          for item in published:
              if not item.get("indexable", True):
                  continue
              needle = f'hreflang="{item["hreflang"]}" href="{base + item.get("path", "")}"'
              assert needle in page, f"{code}: missing alternate {needle}"
          x_default = f'hreflang="x-default" href="{base + default.get("path", "")}"'
          assert x_default in page, f"{code}: missing x-default"

          for item in published:
              assert html.escape(str(item["label"])) in page, f"{code}: missing locale label {item['code']}"

          if path:
              for asset in registry.get("sharedAssets", []):
                  assert f'src="{asset}"' not in page, f"{code}: locale-relative src remains for {asset}"
                  assert f'href="{asset}"' not in page, f"{code}: locale-relative href remains for {asset}"

          for src in re.findall(r'<img[^>]+src="([^"]+)"', page):
              parsed = urlparse(src)
              assert not (
                  parsed.scheme in {"http", "https"}
                  and parsed.hostname == "github.com"
                  and "/blob/" in parsed.path
              ), f"{code}: GitHub blob URL used as image source: {src}"
          PY
          done < /tmp/teamforge-locales.tsv

          python3 - <<'PY' > /tmp/teamforge-runtime.tsv
          import json
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          for item in registry["locales"]:
              if not item.get("publish", True) or not item.get("runtimeTranslation"):
                  continue
              print(item["code"], item["runtimeTranslation"], sep="\t")
          PY

          while IFS=$'\t' read -r code runtime_path; do
            test -n "${code}"
            test -n "${runtime_path}"
            file="/tmp/teamforge-runtime-${code//[^A-Za-z0-9_-]/_}.json"
            url="${base}${runtime_path}"
            echo "Checking runtime translation ${code}: ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              "${url}" > "${file}"
            python3 - "${file}" "${code}" <<'PY'
          import json
          import sys
          path, code = sys.argv[1:]
          bundle = json.load(open(path, encoding="utf-8"))
          assert bundle.get("schemaVersion") == 1, f"{code}: unsupported runtime translation schema"
          assert bundle.get("locale") == code, f"{code}: runtime translation locale mismatch"
          assert isinstance(bundle.get("exact"), dict) and bundle["exact"], f"{code}: empty runtime exact translations"
          assert isinstance(bundle.get("patterns"), list), f"{code}: runtime patterns must be an array"
          PY
          done < /tmp/teamforge-runtime.tsv

          python3 - <<'PY' > /tmp/teamforge-documents.tsv
          import json
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          for item in registry["locales"]:
              if not item.get("publish", True):
                  continue
              documents = item.get("documents") or {}
              assert isinstance(documents, dict)
              for source_route, spec in documents.items():
                  assert isinstance(spec, dict) and spec.get("path")
                  print(
                      item["code"], source_route, spec["path"], item["htmlLang"],
                      "1" if item.get("indexable", True) else "0",
                      sep="\t",
                  )
          PY

          while IFS=$'\t' read -r code source_route path html_lang indexable; do
            test -n "${path}"
            file="/tmp/teamforge-doc-${code//[^A-Za-z0-9_-]/_}-${source_route//[^A-Za-z0-9_-]/_}.html"
            url="${base}${path}"
            echo "Checking localized document ${code} ${source_route}: ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              "${url}" > "${file}"

            python3 - "${file}" "${code}" "${source_route}" "${path}" "${html_lang}" <<'PY'
          import html
          import json
          import re
          import sys

          page_path, code, source_route, path, html_lang = sys.argv[1:]
          base = "https://eun-si123.github.io/teamforge-unity-collab/"
          page = open(page_path, encoding="utf-8").read()
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          published = [item for item in registry["locales"] if item.get("publish", True)]
          default = next(item for item in published if item["code"] == registry["defaultLocale"])

          assert re.search(
              rf'<html\s+lang="{re.escape(html.escape(html_lang, quote=True))}"(?:\s|>)',
              page,
          ), f"{code} {source_route}: wrong html lang"
          assert f'<link rel="canonical" href="{base + path}">' in page, f"{code} {source_route}: canonical mismatch"

          variants = []
          if default.get("indexable", True):
              variants.append((default["hreflang"], base + source_route))
          for item in published:
              if item["code"] == default["code"] or not item.get("indexable", True):
                  continue
              spec = (item.get("documents") or {}).get(source_route)
              if spec:
                  variants.append((item["hreflang"], base + spec["path"]))

          if len(variants) > 1:
              for hreflang, target in variants:
                  needle = f'hreflang="{hreflang}" href="{target}"'
                  assert needle in page, f"{code} {source_route}: missing document alternate {needle}"
              x_default = f'hreflang="x-default" href="{base + source_route}"'
              assert x_default in page, f"{code} {source_route}: missing document x-default"
          PY
          done < /tmp/teamforge-documents.tsv

          python3 - <<'PY' > /tmp/teamforge-assets.txt
          import json
          registry = json.load(open("/tmp/teamforge-locales.json", encoding="utf-8"))
          for asset in registry.get("sharedAssets", []):
              print(asset)
          PY

          while IFS= read -r asset; do
            test -n "${asset}"
            url="${base}${asset}"
            echo "Checking shared asset ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --output /tmp/teamforge-i18n-asset "${url}"
            test -s /tmp/teamforge-i18n-asset
          done < /tmp/teamforge-assets.txt

          echo 'Live locale registry, published locale pages, localized documents, runtime bundles, and shared assets verified.'
