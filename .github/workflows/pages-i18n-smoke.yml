name: Pages i18n smoke

on:
  workflow_run:
    workflows: ["Deploy TeamForge website"]
    types: [completed]

permissions:
  contents: read

jobs:
  localized-pages:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live localized pages and shared assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://eun-si123.github.io/teamforge-unity-collab/"

          paths=(
            "ko/"
            "ko/status/"
            "ko/how-it-works/"
            "assets/teamforge-demo.gif"
            "editor-demo-v2.js"
            "editor-demo-v4.js"
            "editor-demo-localize.js"
            "editor-demo-v4.css"
            "editor-demo-v4-layout-fix.css"
            "site-theme.css"
            "site-responsive.css"
          )

          for path in "${paths[@]}"; do
            url="${base}${path}"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --output /tmp/teamforge-i18n-smoke "${url}"
            test -s /tmp/teamforge-i18n-smoke
          done

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${base}ko/" > /tmp/teamforge-ko-home.html

          grep -F '<html lang="ko">' /tmp/teamforge-ko-home.html
          grep -F '<link rel="canonical" href="https://eun-si123.github.io/teamforge-unity-collab/ko/">' /tmp/teamforge-ko-home.html
          grep -F 'hreflang="en" href="https://eun-si123.github.io/teamforge-unity-collab/"' /tmp/teamforge-ko-home.html
          grep -F 'hreflang="ko" href="https://eun-si123.github.io/teamforge-unity-collab/ko/"' /tmp/teamforge-ko-home.html
          grep -F 'Unity Editor를 위한</span><br>실시간 협업.' /tmp/teamforge-ko-home.html
          grep -F 'src="https://eun-si123.github.io/teamforge-unity-collab/editor-demo-v2.js"' /tmp/teamforge-ko-home.html
          grep -F 'https://eun-si123.github.io/teamforge-unity-collab/assets/teamforge-demo.gif' /tmp/teamforge-ko-home.html
          grep -F 'href="https://eun-si123.github.io/teamforge-unity-collab/ko/status/"' /tmp/teamforge-ko-home.html
          grep -F 'href="https://eun-si123.github.io/teamforge-unity-collab/ko/how-it-works/"' /tmp/teamforge-ko-home.html

          if grep -Fq 'README.ko.md' /tmp/teamforge-ko-home.html; then
            echo 'Korean homepage regressed to README-rendered content.' >&2
            exit 1
          fi
          if grep -Eq '<img[^>]+src="https://github.com/.*/blob/' /tmp/teamforge-ko-home.html; then
            echo 'Korean homepage contains a GitHub blob URL as an image source.' >&2
            exit 1
          fi

          echo 'Live Korean Pages and shared locale assets verified.'