name: Publish TeamForge Current Source Test Candidate r11

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: publish-source-test-candidate-r11
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish latest source test candidate r11
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_TAG: v0.5.1-prealpha-wp5.1-r11
      RELEASE_TITLE: TeamForge 0.5.1 WP5.1 Source Integration Test Candidate r11
      CANDIDATE_NAME: Unity-TeamForge-0.5.1-WP5.1-path-resilience-candidate-r11-win-x64.zip
      STAGED_ROOT_NAME: Unity-TeamForge-0.5.1-WP5.1

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify publication targets reviewed main and Test Lab
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'The r11 candidate may only be published from main after review.'
          }
          # The repository's privacy-preserving history rewrite superseded the
          # historical r7 recovery merge SHA. Pin this candidate to the latest
          # independently validated main baseline instead of an unreachable SHA.
          # This ensures r11 cannot publish from an older source branch.
          $reviewedBaseline = '9b89b3960972609751e9da8ea48d0e9073ffeca7'
          git merge-base --is-ancestor $reviewedBaseline $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Selected r11 source predates the verified November 2026 main baseline.'
          }
          $labWindow = 'unity-package/com.eunsung.teamforge/Editor/Testing/TeamForgeTestLabWindow.cs'
          $labCheck = 'unity-package/com.eunsung.teamforge/Editor/Testing/TeamForgeTwoPcSmokeCheck.cs'
          $labTests = 'unity-package/com.eunsung.teamforge/Tests/Editor/TeamForgeTwoPcSmokeCheckTests.cs'
          foreach ($file in @($labWindow, $labCheck, $labTests)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Test Lab r11 source is missing required file: $file"
            }
          }
          if (-not (Select-String -LiteralPath $labWindow -SimpleMatch 'Two-PC Test Lab (inside Unity)' -Quiet)) {
            throw 'Test Lab Unity UI marker missing from candidate source.'
          }


      - name: Refuse to overwrite an existing r11 release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; its assets remain immutable."
          } else {
            # An absent Release is not permission to reuse an existing Git tag.
            $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify r11 tag absence.' }
            if (-not [string]::IsNullOrWhiteSpace(($existingTag | Out-String).Trim())) {
              throw "Tag $env:RELEASE_TAG already exists without a published Release."
            }
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Neither Release nor tag $env:RELEASE_TAG exists; building a fresh candidate."
          }
          exit 0

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup .NET 10 SDK
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.303'

      - name: Install pinned npm and validate source
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global npm@11.19.0
          if ((npm --version).Trim() -ne '11.19.0') { throw 'Pinned npm 11.19.0 was not selected.' }
          npm run install:all
          npm run validate

      - name: Download pinned Node runtime archive
        if: steps.existing.outputs.exists != 'true'
        id: node_runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'node-v24.19.0-win-x64.zip'
          $extractParent = Join-Path $env:RUNNER_TEMP 'teamforge-node-runtime'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extractParent
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.19.0/node-v24.19.0-win-x64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '57f71ab3652e797d84acddc79c81cc9ff1c6ddb2a1974cdb83f00fee9bff4c73'
          if ($actual -ne $expected) { throw "Pinned Node archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractParent
          $nodeRoot = Join-Path $extractParent 'node-v24.19.0-win-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $nodeRoot 'node.exe') -PathType Leaf)) {
            throw 'Pinned Node runtime did not extract to the expected directory.'
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "root=$nodeRoot" >> $env:GITHUB_OUTPUT

      - name: Build and verify packaged Runtime and Windows Launcher
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          NODE_ARCHIVE: ${{ steps.node_runtime.outputs.archive }}
          NODE_ROOT: ${{ steps.node_runtime.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/build-runtime-bundle.mjs --node-root $env:NODE_ROOT --node-archive $env:NODE_ARCHIVE
          node scripts/verify-runtime-bundle.mjs --packaged
          node scripts/build-launcher.mjs
          node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-publish-verify-r11')
          dotnet run --project launcher/tests/TeamForge.Launcher.Core.Tests/TeamForge.Launcher.Core.Tests.csproj -c Release
          dotnet run --project launcher/tests/TeamForge.Diagnostics.Tests/TeamForge.Diagnostics.Tests.csproj -c Release
          npm run validate:release

      - name: Stage and validate exact candidate tree
        if: steps.existing.outputs.exists != 'true'
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stageRoot = Join-Path $env:RUNNER_TEMP $env:STAGED_ROOT_NAME
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stageRoot
          node scripts/stage-release.mjs --staging $stageRoot

          Push-Location $stageRoot
          try {
            node scripts/validate-public-source.mjs
            node scripts/verify-runtime-bundle.mjs --packaged
            node scripts/verify-launcher.mjs --scratch-root (Join-Path $env:RUNNER_TEMP 'launcher-staged-verify-r11')
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stageRoot 'release-manifest.json') -PathType Leaf)) {
            throw 'Staging completed without release-manifest.json.'
          }
          "root=$stageRoot" >> $env:GITHUB_OUTPUT

      - name: Create immutable ZIP and SHA-256 sidecar
        if: steps.existing.outputs.exists != 'true'
        id: archive
        shell: pwsh
        env:
          STAGE_ROOT: ${{ steps.stage.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:RUNNER_TEMP 'teamforge-release-r11'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $publishRoot
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          $zip = Join-Path $publishRoot $env:CANDIDATE_NAME
          Compress-Archive -LiteralPath $env:STAGE_ROOT -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $sidecar = "$zip.sha256"
          "$hash  $env:CANDIDATE_NAME" | Set-Content -Encoding ascii -NoNewline -LiteralPath $sidecar
          Write-Host "Candidate SHA-256: $hash"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sidecar=$sidecar" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Generate build provenance attestation
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.zip }}

      - name: Verify exact local ZIP before publication
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File scripts/verify-current-release-archive.ps1 -ArchivePath $env:ZIP_PATH
          if ($LASTEXITCODE -ne 0) { throw "Local archive verification failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub pre-release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
          SIDECAR_PATH: ${{ steps.archive.outputs.sidecar }}
          CANDIDATE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $notes = Join-Path $env:RUNNER_TEMP 'teamforge-wp51-r11-release-notes.md'
          $lines = @(
            '## TeamForge 0.5.1 — Source Integration Test Candidate r11',
            '',
            "This is a **pre-release / FIELD_BLOCKED** Windows x64 candidate built from main commit $env:GITHUB_SHA.",
            'It is intended for controlled first-hand Windows Host + Guest testing, not general availability.',
            '',
            '### Features included from source main since the previously published r10 candidate',
            '- M1: supported Collider properties collaborative edits, authority and conditional Undo (#533).',
            '- M2: bounded Collider add/remove changes for supported types (#559, #565).',
            '- M3: supported shared Cube/Sphere creation (#569).',
            '- M4: optional durable confirmed Session recovery after Coordinator restart (#572).',
            '- Reviewed pending Transform/Hierarchy rename/reparent/sibling-order edits can be preserved and resubmitted (#574, #580, #583, #584).',
            '- Host can preview saved Project change summaries without automatically publishing (#586).',
            '- Security/integrity hardening, release/CI fixes and Launcher improvements merged after r10 are included.',
            '',
            '### Known exclusions and readiness',
            '- Guest signed Project update review (#578) is NOT merged; unresolved trust/activation/cancellation concerns remain.',
            '- Shared primitive deletion recovery (#587) and other draft PRs are NOT included.',
            '- Arbitrary Asset/Prefab/multi-Scene editing, seamless NAT relay and general-production readiness are NOT claimed.',
            '- Latest source features have NOT passed exact two-physical-Windows-Editor field acceptance.',
            '- Use backup or disposable Unity projects. Keep existing r10 install and project backups for rollback.',
            '- Do not use this candidate as evidence that FIELD_BLOCKED is resolved.',
            '',
            '### Validation boundaries',
            '- GitHub Actions builds with pinned Node/npm/.NET and runs packaged/runtime/Launcher/source tests.',
            '- This job verifies exact ZIP manifest and per-file hashes and publishes ZIP + SHA-256 sidecar.',
            '- Separate Exact Release Validation downloads the published bytes and tests fresh Windows extraction.',
            '- Only a user-performed physical two-PC trial can prove the Windows Host/Guest Editor acceptance scenarios.',
            '',
            '### Packaging',
            '- Product version: 0.5.1',
            '- Release lineage: 0.5.1-wp5.1-path-resilience',
            '- Target: Windows x64 / Unity 6000.3.x (project/editor exact version required)',
            '- Bundled Node: 24.19.0; Launcher: self-contained .NET 10 Windows build',
            "New immutable r11 ZIP SHA-256: $env:CANDIDATE_SHA256",
            '',
            'The existing r10 ZIP, tag and historical validation are not modified.',
            'Exact r11 Release validation is dispatched separately after publication.'
          )
          $lines -join "`n" | Set-Content -Encoding utf8 -LiteralPath $notes

          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file $notes `
            --prerelease `
            $env:ZIP_PATH `
            $env:SIDECAR_PATH

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,name,isPrerelease,targetCommitish,url,assets

      - name: Dispatch exact r11 Release validation
        if: steps.existing.outputs.exists == 'true' || success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh workflow run release-validation.yml --repo $env:GITHUB_REPOSITORY --ref main -f release_tag=$env:RELEASE_TAG
          Write-Host "Dispatched exact r11 Release validation for $env:RELEASE_TAG."

      - name: Upload publication evidence
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp51-r11-publication-evidence
          path: |
            ${{ steps.archive.outputs.sidecar }}
            ${{ steps.stage.outputs.root }}/release-manifest.json
          if-no-files-found: error
