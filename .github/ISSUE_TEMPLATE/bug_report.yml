name: Bug report
description: Report a reproducible problem in TeamForge
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test TeamForge.

        TeamForge is experimental. Please reproduce issues in a disposable or backed-up Unity project when possible, and remove access tokens, passwords, invite secrets, private IP addresses, API keys, and other sensitive information before posting logs.

        Product version alone does not prove that two packaged candidates contain identical bytes. For packaged builds, please include the release ID plus exact artifact filename and SHA-256 when available. For source testing, include the Git commit/ref.

        Current Launcher source can manually save a bounded/redacted TeamForge support bundle. If that action is available in the exact build you tested, it can be useful to attach, but still review the ZIP before posting it publicly. Do not substitute arbitrary Test Lab/process logs for the support bundle's privacy contract.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I am not relying on an irreplaceable project copy for this test.
          required: true
        - label: I removed or reviewed secrets and private information from anything I am posting publicly, including any support bundle or logs.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Connection / session startup
        - Presence / selection / Editor awareness
        - Transform synchronization
        - Locking / ownership / conflicting edits
        - Project bootstrap / P2P transfer
        - Resume / integrity / recovery
        - Diagnostics / support bundle / error UX
        - Windows Launcher / path resilience
        - Installation / setup
        - Other
    validations:
      required: true

  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: "Example: 6000.3.21f1"
    validations:
      required: true

  - type: input
    id: teamforge-identity
    attributes:
      label: TeamForge source / release identity
      description: For source testing, provide the Git commit/ref. For a packaged candidate, provide product version and release ID from the release contract.
      placeholder: "Example: commit abc1234 OR 0.5.1 / 0.5.1-wp5.1-path-resilience"
    validations:
      required: true

  - type: input
    id: artifact-identity
    attributes:
      label: Packaged artifact filename + SHA-256
      description: Required when practical for a packaged ZIP/build; leave blank for source-only testing. Do not substitute the product version for the artifact hash.
      placeholder: "Example: Unity-TeamForge-...-win-x64.zip / <64-hex SHA-256>"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please be as specific as practical.
      placeholder: |
        1. Start collaboration on Editor A
        2. Join from Editor B
        3. Select ...
        4. Move ...
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Support bundle / logs / diagnostics / screenshots
      description: If the exact Launcher build offers Save support bundle, attach that reviewed ZIP when useful. Otherwise paste only what is safe to share publicly. Redact credentials, invite secrets, private IPs, usernames, and unrelated personal data when appropriate.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include whether the issue is intermittent, whether reconnect/retry changes it, and anything else that may help reproduce it.
