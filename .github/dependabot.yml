version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      server-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /project-peer
    schedule:
      interval: weekly
      day: saturday
      time: "03:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      project-peer-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
