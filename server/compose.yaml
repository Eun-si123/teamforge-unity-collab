services:
  teamforge-server:
    build: .
    restart: unless-stopped
    ports:
      - "${TEAMFORGE_PORT:-5080}:5080"
    environment:
      TEAMFORGE_HOST: 0.0.0.0
      TEAMFORGE_PORT: 5080
      TEAMFORGE_WS_PATH: ${TEAMFORGE_WS_PATH:-/ws}
      TEAMFORGE_HEALTH_PATH: ${TEAMFORGE_HEALTH_PATH:-/health}
      TEAMFORGE_AUTH_TOKEN: ${TEAMFORGE_AUTH_TOKEN:-}
      TEAMFORGE_MAX_MESSAGE_BYTES: ${TEAMFORGE_MAX_MESSAGE_BYTES:-1048576}
      TEAMFORGE_MAX_CONNECTIONS: ${TEAMFORGE_MAX_CONNECTIONS:-32}
      TEAMFORGE_RATE_LIMIT_PER_SECOND: ${TEAMFORGE_RATE_LIMIT_PER_SECOND:-60}
      TEAMFORGE_LOCK_LEASE_MS: ${TEAMFORGE_LOCK_LEASE_MS:-15000}
      TEAMFORGE_MAX_RECENT_OPERATIONS: ${TEAMFORGE_MAX_RECENT_OPERATIONS:-4096}
      TEAMFORGE_MAX_RETAINED_TRANSFORMS: ${TEAMFORGE_MAX_RETAINED_TRANSFORMS:-512}
      TEAMFORGE_MAX_LOCKS_PER_CONNECTION: ${TEAMFORGE_MAX_LOCKS_PER_CONNECTION:-8}
      TEAMFORGE_MAX_LOCKS_PER_SESSION: ${TEAMFORGE_MAX_LOCKS_PER_SESSION:-256}
      TEAMFORGE_MAX_SNAPSHOT_BYTES: ${TEAMFORGE_MAX_SNAPSHOT_BYTES:-921600}
      TEAMFORGE_MAX_BUFFERED_BYTES: ${TEAMFORGE_MAX_BUFFERED_BYTES:-1048576}
      TEAMFORGE_HELLO_TIMEOUT_MS: ${TEAMFORGE_HELLO_TIMEOUT_MS:-10000}
      TEAMFORGE_HEARTBEAT_INTERVAL_MS: ${TEAMFORGE_HEARTBEAT_INTERVAL_MS:-15000}
      TEAMFORGE_HEARTBEAT_TIMEOUT_MS: ${TEAMFORGE_HEARTBEAT_TIMEOUT_MS:-45000}
      TEAMFORGE_MAX_PROJECT_REGISTRIES: ${TEAMFORGE_MAX_PROJECT_REGISTRIES:-1024}
      TEAMFORGE_MAX_PROJECT_PEERS_PER_SESSION: ${TEAMFORGE_MAX_PROJECT_PEERS_PER_SESSION:-32}
