# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "Write concise, direct Korean reviews. Explain concrete risks, impact, and practical fixes. Be constructive, flag uncertainty, and avoid style-only nitpicks."
reviews:
  profile: "assertive"
  poem: false
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: true
    # Review stacked WP6/agent PRs, not just PRs targeting main.
    base_branches:
      - "^agent/teamforge/.*$"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  path_instructions:
    - path: "**/*"
      instructions: |
        Look assertively for concrete correctness, security, privacy, integrity,
        concurrency, lifecycle, resource, recovery, and regression defects.
        Include subtle edge cases when a realistic failure mode exists.
        For each finding, explain the trigger, impact, and a minimal fix or
        regression test. Distinguish evidence from speculation.
        Report minor issues when they cause real behavior or maintainability
        risks; skip purely stylistic, naming, or formatting nitpicks and
        speculative refactors without a demonstrated consequence.
        Apply the more specific path instructions below as well.
    - path: "server/src/**"
      instructions: |
        Prioritize authorization, bounded untrusted messages, session ownership,
        idempotency, replay ordering, concurrency and fail-closed error handling.
        Flag concrete regressions, not speculative architecture rewrites.
    - path: "unity-package/**"
      instructions: |
        Prioritize Unity main-thread and Editor lifecycle safety, Scene consistency,
        locks/ownership, data loss, asset integrity and reconnect behavior.
        Distinguish unit evidence from real two-editor or two-machine validation.
    - path: "project-peer/src/**"
      instructions: |
        Prioritize invite authorization, signatures, hash verification, resume safety,
        path containment, bounded network input and failure recovery.
    - path: "launcher/**"
      instructions: |
        Prioritize credential redaction, process lifecycle, cancellation, project
        safety, path boundaries and actionable negative-path regression tests.
